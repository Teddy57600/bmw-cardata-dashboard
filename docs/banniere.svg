<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Ma BMW sur PC — tableau de bord BMW CarData">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d131c"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#3d8bff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d5e"/>
      <stop offset=".4" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#7cc4ff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".2" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fb0c7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7cc4ff" stroke-opacity=".06"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="28" fill="url(#halo)"/>
  <rect x="1" y="1" width="1278" height="378" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>

  <!-- jauge -->
  <g transform="translate(1000 205)">
    <path d="M-121 70 A140 140 0 1 1 121 70" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="20" stroke-linecap="round"/>
    <path d="M-121 70 A140 140 0 0 1 104 -94" fill="none" stroke="url(#arc)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
    <g stroke="#ffffff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
      <line x1="-96" y1="55" x2="-86" y2="49"/><line x1="-110" y1="0" x2="-98" y2="0"/><line x1="-96" y1="-55" x2="-86" y2="-49"/>
      <line x1="-55" y1="-96" x2="-49" y2="-86"/><line x1="0" y1="-110" x2="0" y2="-98"/><line x1="55" y1="-96" x2="49" y2="-86"/>
      <line x1="96" y1="-55" x2="86" y2="-49"/><line x1="110" y1="0" x2="98" y2="0"/><line x1="96" y1="55" x2="86" y2="49"/>
    </g>
    <line x1="0" y1="0" x2="70" y2="-64" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <circle r="18" fill="#ffffff"/><circle r="7" fill="#05070a"/>
    <text x="0" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">72<tspan font-size="24" fill="#8a94a3" dx="4">%</tspan></text>
  </g>

  <!-- titre -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="72" y="76" width="44" height="5" rx="2.5" fill="#3d8bff"/>
    <text x="130" y="86" font-size="18" font-weight="700" letter-spacing="7" fill="#c8d3e2">BMW CARDATA</text>
    <text x="70" y="176" font-size="84" font-weight="300" fill="url(#title)">Ma BMW</text>
    <text x="70" y="250" font-size="84" font-weight="800" fill="url(#title)">sur PC</text>
    <text x="72" y="304" font-size="24" fill="#8a94a3">Tableau de bord, streaming MQTT en direct et données de votre voiture</text>
  </g>

  <!-- pastille « en direct » -->
  <g transform="translate(70 326)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="132" height="32" rx="16" fill="#33d69f" fill-opacity=".1" stroke="#33d69f" stroke-opacity=".4"/>
    <circle cx="20" cy="16" r="5" fill="#33d69f"/>
    <text x="34" y="22" font-size="15" font-weight="600" fill="#33d69f">En direct</text>
  </g>
</svg>
